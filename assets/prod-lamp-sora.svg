  <rect width="768" height="1024" fill="url(#bg)" />
  <circle cx="384" cy="420" r="260" fill="url(#warmGlow)" />

  <rect x="28" y="28" width="712" height="968" rx="24" fill="none" stroke="#E4DCD2" stroke-width="2" />

