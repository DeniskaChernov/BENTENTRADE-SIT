  <text x="384" y="940" text-anchor="middle" font-family="'Montserrat', -apple-system, sans-serif" font-size="13" font-weight="600" letter-spacing="4" fill="#9C8E80">BTT - МЕБЕЛЬ ДЛЯ ДОМА И САДА</text>
