  </g>

  <text x="384" y="690" text-anchor="middle" font-family="'Montserrat', -apple-system, sans-serif" font-size="34" font-weight="800" letter-spacing="2" fill="#221E1A">ЛАМПА SORA</text>
  <text x="384" y="732" text-anchor="middle" font-family="'Montserrat', -apple-system, sans-serif" font-size="16" font-weight="500" fill="#70665C">Мягкое тёплое освещение</text>
