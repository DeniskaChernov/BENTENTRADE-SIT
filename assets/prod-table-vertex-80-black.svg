<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 768 1024" width="768" height="1024">
  <defs>
    <linearGradient id="bgBlack" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#242220" />
      <stop offset="100%" stop-color="#161514" />
    </linearGradient>
    <radialGradient id="tableGlowDark" cx="50%" cy="42%" r="42%">
      <stop offset="0%" stop-color="#3D3A36" stop-opacity="0.8" />
      <stop offset="60%" stop-color="#262422" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#161514" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="marbleBlack" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2D2B29" />
      <stop offset="45%" stop-color="#22201F" />
      <stop offset="100%" stop-color="#1A1817" />
    </linearGradient>
    <linearGradient id="metalLegsDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4A4744" />
      <stop offset="100%" stop-color="#22201E" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="768" height="1024" fill="url(#bgBlack)" />
  <circle cx="384" cy="420" r="280" fill="url(#tableGlowDark)" />
  <rect x="28" y="28" width="712" height="968" rx="24" fill="none" stroke="#3D3934" stroke-width="2" />

  <!-- Category Tag -->
  <text x="384" y="105" text-anchor="middle" font-family="'Montserrat', -apple-system, sans-serif" font-size="14" font-weight="700" letter-spacing="5" fill="#D97736">СТОЛЫ BTT</text>

  <!-- Table Vector Illustration -->
  <g transform="translate(384, 410)">
    <!-- Shadow beneath table -->
    <ellipse cx="0" cy="180" rx="230" ry="46" fill="#000000" fill-opacity="0.45" filter="blur(10px)" />

    <!-- Table Base & Legs (Metal) -->
    <!-- Rear Legs -->
    <rect x="-155" y="-10" width="14" height="175" rx="3" fill="#1C1A19" />
    <rect x="141" y="-10" width="14" height="175" rx="3" fill="#1C1A19" />

    <!-- Front Legs -->
    <rect x="-185" y="35" width="16" height="170" rx="3" fill="url(#metalLegsDark)" />
    <rect x="169" y="35" width="16" height="170" rx="3" fill="url(#metalLegsDark)" />

    <!-- Lower crossbeams for stability -->
    <path d="M-180,185 L180,185" stroke="#2B2927" stroke-width="8" stroke-linecap="round" />
    <path d="M-150,150 L150,150" stroke="#181716" stroke-width="6" stroke-linecap="round" opacity="0.8" />

    <!-- Under-table metal support sub-frame -->
    <polygon points="-190,40 190,40 160,-15 -160,-15" fill="#1A1817" />

    <!-- Table Top (Square Perspective Slab - Black Marble) -->
    <!-- Slab thickness / edge -->
    <polygon points="-210,38 210,38 210,54 -210,54" fill="#1E1C1B" stroke="#2D2B29" stroke-width="1.5" />
    <!-- Main surface -->
    <polygon points="0,-85 225,32 0,65 -225,32" fill="url(#marbleBlack)" stroke="#383532" stroke-width="2" />

    <!-- Marble veining detail (light gray/white veins on dark) -->
    <path d="M-120,10 Q-60,-15 10,-5 T130,25" fill="none" stroke="#5E5852" stroke-width="2" opacity="0.6" />
    <path d="M-40,25 Q30,-40 90,-20 T170,10" fill="none" stroke="#6B645D" stroke-width="1.5" opacity="0.5" />
    <path d="M-170,25 Q-110,40 -20,30" fill="none" stroke="#524C46" stroke-width="1.8" opacity="0.55" />

    <!-- Subtle highlight on top edge -->
    <line x1="-220" y1="32" x2="0" y2="65" stroke="#7A726A" stroke-width="1.8" opacity="0.7" />
    <line x1="0" y1="65" x2="220" y2="32" stroke="#615B54" stroke-width="1.4" opacity="0.5" />
  </g>

  <!-- Typography & Specs -->
  <text x="384" y="680" text-anchor="middle" font-family="'Montserrat', -apple-system, sans-serif" font-size="32" font-weight="800" letter-spacing="1.5" fill="#F2EDE6">СТОЛ VERTEX 80×80</text>
  <text x="384" y="722" text-anchor="middle" font-family="'Montserrat', -apple-system, sans-serif" font-size="16" font-weight="500" fill="#ABA298">Чёрный мрамор · Квадратный обеденный стол</text>
  <text x="384" y="758" text-anchor="middle" font-family="'Montserrat', -apple-system, sans-serif" font-size="16" font-weight="600" letter-spacing="1" fill="#C4B8AB">Габариты: 80 × 80 × 75 см · ЛДСП и металл</text>

  <!-- CTA / Price Badge -->
  <g transform="translate(384, 835)">
    <rect x="-140" y="-26" width="280" height="52" rx="26" fill="#D97736" />
    <text x="0" y="8" text-anchor="middle" font-family="'Montserrat', -apple-system, sans-serif" font-size="18" font-weight="700" fill="#FFFFFF">ЦЕНА ПО ЗАПРОСУ</text>
  </g>

  <!-- Footer -->
  <text x="384" y="935" text-anchor="middle" font-family="'Montserrat', -apple-system, sans-serif" font-size="13" font-weight="600" letter-spacing="4" fill="#80766B">BTT - МЕБЕЛЬ ДЛЯ ДОМА И САДА</text>
</svg>
